services:
  - type: web
    name: smartweigh-ai
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production

      # ─── Configure values manually in Render Dashboard → Environment ───
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SYSTEM_MASTER_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SHARED_SECRET
        sync: false

      # ─── Gemini AI API Key ───────────────────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false

      # ─── (Optional) Direct PostgreSQL connection string ─────────────────────────────────────────
      # - key: DATABASE_URL
      #   sync: false
